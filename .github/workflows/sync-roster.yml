name: Sync site data (roster + Google reviews)

# Once a day (and any time from the Actions tab):
#  - copies the SBI Website Roster Google Doc into index.html (the site also reads it live)
#  - pulls Google reviews into data/reviews.json and the Testimonials carousel
# All sync steps live in scripts/sync-site.mjs, so new ones never need this file changed.
on:
  schedule:
    - cron: "17 10 * * *" # every day around 6am Eastern
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-site
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Sync roster and reviews
        id: sync
        run: node scripts/sync-site.mjs
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

      - name: Commit whatever synced
        if: always()
        run: |
          git add index.html data
          if git diff --cached --quiet; then
            echo "Site data already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync roster and Google reviews"
          git push
