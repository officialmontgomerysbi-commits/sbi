<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Not Found | Montgomery Small Business Initiative</title>
  <meta name="robots" content="noindex, follow"/>
  <link rel="icon" type="image/png" href="/SBI Logo-2.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    :root { --green:#25a86f; --green-dark:#4a8a6e; --cream:#faf8f4; --dark:#1a1a1a; --mid:#555; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--dark);
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; text-align:center; padding:2rem;
    }
    img { width:140px; height:140px; object-fit:contain; margin-bottom:2rem; }
    h1 { font-family:'Playfair Display',serif; font-size:clamp(2.5rem,6vw,4rem); font-weight:900; letter-spacing:-0.03em; }
    h1 span { color:var(--green); }
    p { color:var(--mid); font-size:1.05rem; line-height:1.7; max-width:440px; margin:1rem 0 2rem; }
    a {
      background:var(--green); color:#fff; padding:14px 32px; border-radius:4px;
      text-decoration:none; font-weight:600; font-size:0.9rem; letter-spacing:0.04em;
      transition:background 0.2s;
    }
    a:hover { background:var(--green-dark); }
  </style>
</head>
<body>
  <img src="/SBI Logo-2.png" alt="Montgomery Small Business Initiative logo"/>
  <h1>404<br><span>Page Not Found</span></h1>
  <p>That page does not exist, or it moved. Head back to the homepage to find what you are looking for.</p>
  <a href="/">Back to Home</a>
</body>
</html>
